version: "3.9"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: face_attendance
      POSTGRES_USER: face_user
      POSTGRES_PASSWORD: face_password
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U face_user -d face_attendance"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      DATABASE_URL: postgresql://face_user:face_password@db:5432/face_attendance
      SECRET_KEY: change_this_in_production
    volumes:
      # Persist uploaded face images across container restarts
      - face_images:/app/static/faces
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  face_images:

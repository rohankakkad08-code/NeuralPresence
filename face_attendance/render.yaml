services:
  - type: web
    name: face-attendance
    env: docker
    plan: free
    region: oregon
    rootDir: .
    dockerfilePath: ./Dockerfile
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: face-attendance-db
          property: connectionString

databases:
  - name: face-attendance-db
    databaseName: face_attendance
    user: face_user
    plan: free

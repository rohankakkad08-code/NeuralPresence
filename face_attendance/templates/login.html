<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login — NeuralPresence</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
</head>
<body class="auth-body">
  <canvas id="particles"></canvas>
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>

  <div class="auth-container">
    <div class="auth-left">
      <div class="auth-brand">
        <i class="fas fa-brain"></i>
        <span>Neural<b>Presence</b></span>
      </div>
      <h2>Welcome Back</h2>
      <p>Sign in to manage your face recognition attendance system.</p>
      <ul class="auth-features">
        <li><i class="fas fa-check-circle"></i> Real-time face recognition</li>
        <li><i class="fas fa-check-circle"></i> Cloud attendance logging</li>
        <li><i class="fas fa-check-circle"></i> Smart analytics dashboard</li>
        <li><i class="fas fa-check-circle"></i> Export reports instantly</li>
      </ul>
      <div class="auth-visual">
        <div class="login-face-anim">
          <div class="lf-ring"></div>
          <div class="lf-ring-2"></div>
          <i class="fas fa-user-shield lf-icon"></i>
          <div class="lf-scan"></div>
        </div>
      </div>
    </div>
    <div class="auth-right">
      <div class="login-card">
        <h3>Sign In</h3>
        <p class="login-sub">Enter your administrator credentials</p>
        <div id="login-error" class="alert-error" style="display:none"></div>
        <div class="form-group">
          <label><i class="fas fa-user"></i> Username</label>
          <input type="text" id="username" placeholder="Enter username" autocomplete="username"/>
        </div>
        <div class="form-group">
          <label><i class="fas fa-lock"></i> Password</label>
          <div class="pass-wrap">
            <input type="password" id="password" placeholder="Enter password" autocomplete="current-password"/>
            <button type="button" class="pass-toggle" id="passToggle"><i class="fas fa-eye"></i></button>
          </div>
        </div>
        <div class="form-check">
          <label><input type="checkbox" id="rememberMe"/> Remember me</label>
          <a href="#" class="forgot-link">Forgot password?</a>
        </div>
        <button class="btn-primary full-width" id="loginBtn" onclick="doLogin()">
          <span id="loginText"><i class="fas fa-sign-in-alt"></i> Sign In</span>
          <span id="loginSpinner" style="display:none"><i class="fas fa-circle-notch fa-spin"></i> Signing in...</span>
        </button>
        <div class="demo-hint">
          <i class="fas fa-info-circle"></i> Demo: <code>admin</code> / <code>admin123</code>
        </div>
      </div>
    </div>
  </div>

  <script src="{{ url_for('static', filename='js/main.js') }}"></script>
  <script>
    async function doLogin() {
      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value;
      const loginText = document.getElementById("loginText");
      const spinner  = document.getElementById("loginSpinner");

      if (!username || !password) { showErr("Please fill all fields."); return; }

      loginText.style.display = "none";
      spinner.style.display   = "inline";

      try {
        const res = await fetch("/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username, password })
        });

        // Guard: make sure we got JSON back, not an HTML error page
        const contentType = res.headers.get("content-type") || "";
        if (!contentType.includes("application/json")) {
          showErr("Server returned unexpected response (status " + res.status + "). Check the terminal for errors.");
          loginText.style.display = "inline"; spinner.style.display = "none";
          return;
        }

        const data = await res.json();
        if (data.success) {
          window.location.href = "/dashboard";
        } else {
          showErr(data.message || "Invalid credentials");
        }
      } catch (e) {
        // Network-level failure — server is down or wrong URL
        showErr("Cannot reach the server. Make sure you opened this page from http://localhost:5000/login and the server is running (double-click run.bat).");
        console.error("Login fetch error:", e);
      }

      loginText.style.display = "inline";
      spinner.style.display   = "none";
    }

    function showErr(msg) {
      const e = document.getElementById("login-error");
      e.textContent = msg;
      e.style.display = "block";
      setTimeout(() => e.style.display = "none", 6000);
    }

    document.addEventListener("keydown", e => { if (e.key === "Enter") doLogin(); });

    document.getElementById("passToggle").addEventListener("click", function () {
      const inp = document.getElementById("password");
      const ic  = this.querySelector("i");
      if (inp.type === "password") { inp.type = "text";     ic.className = "fas fa-eye-slash"; }
      else                         { inp.type = "password"; ic.className = "fas fa-eye"; }
    });

    // Warn immediately if page was opened as a file:// instead of via Flask
    if (window.location.protocol === "file:") {
      document.getElementById("login-error").textContent =
        "⚠️ You opened this as a file. Open http://localhost:5000 in your browser instead (after running run.bat).";
      document.getElementById("login-error").style.display = "block";
    }
  </script>
</body>
</html>
